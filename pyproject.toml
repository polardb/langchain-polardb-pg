[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-polardb-pg"
version = "0.1.0"
description = "LangChain integration for PolarDB for PostgreSQL"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "Alibaba Cloud PolarDB Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["langchain", "polardb", "postgresql", "vectorstore", "embeddings"]
dependencies = [
    "langchain-postgres>=0.0.17",
    "langchain-core>=0.3.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
]

[project.urls]
Homepage = "https://github.com/polardb/langchain-polardb-pg"
Repository = "https://github.com/polardb/langchain-polardb-pg"
Documentation = "https://github.com/polardb/langchain-polardb-pg#readme"
Changelog = "https://github.com/polardb/langchain-polardb-pg/blob/main/CHANGELOG.md"
Issues = "https://github.com/polardb/langchain-polardb-pg/issues"

[project.optional-dependencies]
cloud = [
    "alibabacloud-polardb20170801>=6.0",
    "alibabacloud-tea-openapi>=0.3",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
integration = [
    "langchain-tests==0.3.22",
    "urllib3<2; python_version < '3.10'",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "langchain-tests==0.3.22",
    "urllib3<2; python_version < '3.10'",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
    "build>=1.2.0",
    "twine>=6.1.0,<6.2.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live PolarDB instance or external service credentials",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
