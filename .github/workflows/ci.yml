name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Format check
        run: python -m ruff format --check src tests

      - name: Run unit tests
        run: python -m pytest tests/unit_tests -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install -e ".[dev]"

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

  integration-tests:
    name: LangChain standard integration tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check integration test secrets
        id: integration_secrets
        env:
          POLARDB_CLUSTER_ID: ${{ secrets.POLARDB_CLUSTER_ID }}
          POLARDB_DATABASE: ${{ secrets.POLARDB_DATABASE }}
          POLARDB_USER: ${{ secrets.POLARDB_USER }}
          POLARDB_PASSWORD: ${{ secrets.POLARDB_PASSWORD }}
          POLARDB_NETWORK_TYPE: ${{ secrets.POLARDB_NETWORK_TYPE }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          missing=()
          for name in \
            POLARDB_CLUSTER_ID \
            POLARDB_DATABASE \
            POLARDB_USER \
            POLARDB_PASSWORD \
            POLARDB_NETWORK_TYPE \
            ALIBABA_CLOUD_ACCESS_KEY_ID \
            ALIBABA_CLOUD_ACCESS_KEY_SECRET
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Skipping integration tests; missing secrets: ${missing[*]}"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip integration tests
        if: steps.integration_secrets.outputs.has_secrets != 'true'
        run: echo "PolarDB integration test secrets are not configured."

      - uses: actions/checkout@v4
        if: steps.integration_secrets.outputs.has_secrets == 'true'

      - uses: actions/setup-python@v5
        if: steps.integration_secrets.outputs.has_secrets == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with integration dependencies
        if: steps.integration_secrets.outputs.has_secrets == 'true'
        run: python -m pip install -e ".[dev,cloud]"

      - name: Run standard integration tests
        if: steps.integration_secrets.outputs.has_secrets == 'true'
        env:
          POLARDB_CLUSTER_ID: ${{ secrets.POLARDB_CLUSTER_ID }}
          POLARDB_DATABASE: ${{ secrets.POLARDB_DATABASE }}
          POLARDB_USER: ${{ secrets.POLARDB_USER }}
          POLARDB_PASSWORD: ${{ secrets.POLARDB_PASSWORD }}
          POLARDB_NETWORK_TYPE: ${{ secrets.POLARDB_NETWORK_TYPE }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python -m pytest tests/integration_tests -q
